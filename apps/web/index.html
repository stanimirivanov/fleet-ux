<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetIQ</title>
    <script>
      (() => {
        let resolved = "light";
        try {
          const stored = localStorage.getItem("fleetiq.theme-preference.v1");
          if (
            stored === "dark" ||
            (stored === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            resolved = "dark";
          }
        } catch {
          resolved = "light";
        }
        document.documentElement.dataset.theme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
