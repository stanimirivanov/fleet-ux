name: User guide

on:
  workflow_run:
    workflows:
      - Web quality gate
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleetiq-user-guide-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build complete executable user guide
    # workflow_run can run with higher privilege. Accept only this repository's
    # successfully verified push to main, never a pull-request run or fork.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pinned package manager
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify and generate production and sample journeys
        run: pnpm guide:generate

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/user-guide

      - name: Upload guide failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-user-guide-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
            dist/user-guide
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish executable user guide
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
